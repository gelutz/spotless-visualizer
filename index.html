<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotless Config Visualizer</title>
</head>
<body>

<header>
  <h1>Spotless Config Visualizer</h1>
  <span class="sub">toggle steps &rarr; see what they do &middot;
    <a href="https://github.com/diffplug/spotless/blob/main/plugin-gradle/README.md" target="_blank" rel="noopener">spotless docs</a></span>
</header>

<nav id="languages" aria-label="language"></nav>

<div id="app">
  <div class="col left">
    <section class="pane steps">
      <div class="pane-head">
        <span>Spotless steps</span>
        <span class="spacer"></span>
        <button id="btn-reset">reset</button>
      </div>
      <div class="pane-body" id="steps"></div>
    </section>

    <section class="pane config">
      <div class="pane-head">
        <button class="tab active" data-build="gradle">build.gradle</button>
        <button class="tab" data-build="maven">pom.xml</button>
        <span class="spacer"></span>
        <button id="btn-copy">copy</button>
      </div>
      <div class="pane-body"><pre id="config"></pre></div>
    </section>
  </div>

  <div class="col">
    <section class="pane result">
      <div class="pane-head">
        <span id="src-name">Example.java</span>
        <span class="badge" id="src-badge" hidden>custom</span>
        <span class="spacer"></span>
        <button id="btn-restore" hidden>restore sample</button>
        <button class="tab active" data-view="diff">diff</button>
        <button class="tab" data-view="result">result only</button>
        <button class="tab" data-view="source">source</button>
      </div>
      <div class="src-note" id="src-note" hidden></div>
      <div class="pane-body" id="result-body"><pre id="result"></pre><textarea id="source" spellcheck="false" hidden
        aria-label="Source to format"></textarea></div>
    </section>
  </div>
</div>

<div id="tip"></div>

<div id="modal" hidden>
  <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-head">
      <span id="modal-title"></span>
      <span class="spacer"></span>
      <button id="modal-close" aria-label="close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
