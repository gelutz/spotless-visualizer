<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotless Config Visualizer</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #191c24;
    --panel-2: #1f232d;
    --border: #2c313d;
    --fg: #d7dae1;
    --fg-dim: #8b93a3;
    --accent: #7aa2f7;
    --add-bg: #12331f;
    --add-fg: #7ee2a8;
    --del-bg: #3a1720;
    --del-fg: #f78a9a;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .sub { color: var(--fg-dim); font-size: 12px; }
  header a { color: var(--accent); }

  #app {
    display: grid;
    grid-template-columns: minmax(360px, 34%) 1fr;
    height: calc(100vh - 42px);
  }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; height: auto; }
  }

  .col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .col.left { border-right: 1px solid var(--border); }

  .pane {
    display: flex; flex-direction: column;
    min-height: 0;
    background: var(--panel);
  }
  .pane + .pane { border-top: 1px solid var(--border); }
  .pane.steps { flex: 1 1 55%; }
  .pane.config { flex: 1 1 45%; }
  .pane.result { flex: 1 1 auto; }

  .pane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--fg-dim);
    flex: 0 0 auto;
  }
  .pane-head .spacer { flex: 1; }
  .pane-body { overflow: auto; flex: 1 1 auto; min-height: 0; }

  button, .tab {
    font: inherit;
    font-size: 11px;
    background: var(--panel);
    color: var(--fg-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 9px;
    cursor: pointer;
  }
  button:hover, .tab:hover { color: var(--fg); border-color: #3d4454; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #10131a; font-weight: 600; }

  .group-title {
    padding: 9px 12px 4px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--fg-dim);
  }
  .group-note {
    padding: 0 12px 6px;
    font-size: 11px;
    color: #6f7789;
  }

  .step {
    padding: 5px 12px 6px;
    border-bottom: 1px solid #22262f;
  }
  .step.on { background: #1c2130; }
  .step-row { display: flex; align-items: center; gap: 7px; }
  .step-row label { cursor: pointer; font-family: var(--mono); font-size: 12px; }
  .step.on .step-row label { color: #fff; }
  .step .doc { color: var(--fg-dim); font-size: 11px; margin: 2px 0 0 22px; }
  .step .opts {
    margin: 5px 0 1px 22px;
    display: none;
    flex-wrap: wrap;
    gap: 5px 10px;
  }
  .step.on .opts { display: flex; }
  .opt { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--fg-dim); }
  .opt input[type=text], .opt input[type=number], .opt select {
    font: 11px/1.4 var(--mono);
    background: #0f1116;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 5px;
  }
  .opt input[type=text] { width: 150px; }
  .opt input[type=text].wide { width: 240px; }
  .opt input[type=number] { width: 52px; }

  pre {
    margin: 0;
    padding: 10px 0;
    font: 12px/1.55 var(--mono);
    tab-size: 4;
  }
  pre .ln {
    display: block;
    padding: 0 12px 0 52px;
    text-indent: -40px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  pre .ln::before {
    content: attr(data-n);
    display: inline-block;
    width: 34px;
    margin-right: 6px;
    text-align: right;
    color: #4a5163;
    text-indent: 0;
    user-select: none;
  }
  .ln.add { background: var(--add-bg); color: var(--add-fg); }
  .ln.del { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; text-decoration-color: #7d3444; }
  .ws { color: #55607a; }
  .eof { color: #4a5163; font-style: italic; }

  .ln[data-blame] { cursor: help; }
  .ln[data-blame]:hover { outline: 1px solid #4a5b7d; outline-offset: -1px; }

  #tip {
    position: fixed;
    z-index: 50;
    display: none;
    max-width: 380px;
    padding: 7px 10px;
    background: #0c0e13;
    border: 1px solid #3d4454;
    border-radius: 5px;
    box-shadow: 0 6px 20px rgba(0,0,0,.55);
    font: 11px/1.5 var(--mono);
    color: var(--fg);
    white-space: pre-wrap;
    pointer-events: none;
  }
  #tip .tip-head {
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: .07em;
    font-size: 9px;
    margin-bottom: 4px;
  }
  #tip .tip-step { color: var(--accent); }

  button.help {
    width: 17px; height: 17px;
    padding: 0;
    border-radius: 50%;
    font-size: 10px;
    line-height: 1;
    color: var(--fg-dim);
    background: transparent;
    flex: 0 0 auto;
  }
  button.help:hover { background: var(--accent); border-color: var(--accent); color: #10131a; }

  #modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(6,8,12,.72);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #modal[hidden] { display: none; }
  #modal-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
    width: min(680px, 100%);
    max-height: 100%;
    display: flex; flex-direction: column;
  }
  #modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 8px 8px 0 0;
  }
  #modal-head .spacer { flex: 1; }
  #modal-title { font: 600 13px var(--mono); color: var(--accent); }
  #modal-close { border: none; background: transparent; font-size: 13px; }
  #modal-body { padding: 14px; overflow: auto; }
  #modal-body h4 {
    margin: 16px 0 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--fg-dim);
    font-weight: 600;
  }
  #modal-body h4:first-child { margin-top: 0; }
  #modal-body p { margin: 0; color: var(--fg); }
  #modal-body ul { margin: 0; padding-left: 18px; }
  #modal-body li { margin-bottom: 4px; }
  #modal-body code {
    font: 11px var(--mono);
    background: #0f1116;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 4px;
  }
  #modal-body .opt-row {
    display: grid;
    grid-template-columns: minmax(160px, max-content) 1fr;
    gap: 4px 12px;
    align-items: baseline;
    margin-bottom: 5px;
  }
  #modal-body .opt-row span { color: var(--fg-dim); }
  #modal-body .note {
    margin-top: 14px;
    padding: 8px 10px;
    border-left: 2px solid #5a6480;
    background: #171b24;
    color: var(--fg-dim);
    border-radius: 0 4px 4px 0;
  }
</style>
</head>
<body>

<header>
  <h1>Spotless Config Visualizer</h1>
  <span class="sub">toggle steps &rarr; see what they do to Java &middot;
    <a href="https://github.com/diffplug/spotless/blob/main/plugin-gradle/README.md" target="_blank" rel="noopener">spotless docs</a></span>
</header>

<div id="app">
  <div class="col left">
    <section class="pane steps">
      <div class="pane-head">
        <span>Spotless steps</span>
        <span class="spacer"></span>
        <button id="btn-reset">reset</button>
      </div>
      <div class="pane-body" id="steps"></div>
    </section>

    <section class="pane config">
      <div class="pane-head">
        <button class="tab active" data-build="gradle">build.gradle</button>
        <button class="tab" data-build="maven">pom.xml</button>
        <span class="spacer"></span>
        <button id="btn-copy">copy</button>
      </div>
      <div class="pane-body"><pre id="config"></pre></div>
    </section>
  </div>

  <div class="col">
    <section class="pane result">
      <div class="pane-head">
        <span>Example.java</span>
        <span class="spacer"></span>
        <button class="tab active" data-view="diff">diff</button>
        <button class="tab" data-view="result">result only</button>
      </div>
      <div class="pane-body"><pre id="result"></pre></div>
    </section>
  </div>
</div>

<div id="tip"></div>

<div id="modal" hidden>
  <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-head">
      <span id="modal-title"></span>
      <span class="spacer"></span>
      <button id="modal-close" aria-label="close">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Sample Java, one per "big formatter" variant.
 *
 * The real googleJavaFormat / palantirJavaFormat / eclipse steps are full
 * Java reformatters and cannot run in a browser, so these are hand-written
 * illustrative snapshots. Every other step below is a real implementation
 * that runs on top of whichever variant is selected.
 * ------------------------------------------------------------------ */

const T = "\t";
const SP = " ";

// `none`: deliberately messy. Trips every cheap step at once.
const SAMPLE_NONE = [
  "package com.example.demo;",
  "",
  "import java.util.List;",
  "import static org.junit.jupiter.api.Assertions.assertEquals;",
  "import com.example.util.Strings;",
  "import java.util.Date;",
  "import java.util.ArrayList;" + SP + SP,
  "import javax.annotation.Nullable;",
  "import com.google.common.collect.ImmutableList;",
  "import static java.util.Objects.requireNonNull;",
  "",
  "public class Example {",
  T + "private final List<String> items = new ArrayList<String>();",
  "",
  T + "@Nullable",
  T + "private String name;" + SP,
  "",
  T + "@Override",
  T + "public String toString() {",
  "        return \"Example: TODO fix this\";",
  T + "}",
  "",
  T + "public void add(String item, boolean flag) {",
  T + T + "requireNonNull(item);",
  T + T + "if (flag == true) {",
  T + T + T + "items.add(Strings.trim(item));" + SP + SP + SP,
  T + T + "}",
  T + "}",
  "",
  T + "// spotless:off",
  T + "private static final int[] MATRIX = {",
  T + T + "1,   0,   0,",
  T + T + "0,   1,   0,   // TODO alignment kept on purpose" + SP,
  T + T + "0,   0,   1 };",
  T + "// spotless:on",
  "",
  T + "public void check() {",
  T + T + "assertEquals(1, ImmutableList.of(\"a\").size());",
  T + "}",
  "}"
].join("\n"); // note: no trailing newline

// googleJavaFormat(): 2-space indent, annotations kept on own lines, imports
// left alone (gjf does not reorder them unless importOrder runs).
const SAMPLE_GJF = [
  "package com.example.demo;",
  "",
  "import java.util.List;",
  "import static org.junit.jupiter.api.Assertions.assertEquals;",
  "import com.example.util.Strings;",
  "import java.util.Date;",
  "import java.util.ArrayList;",
  "import javax.annotation.Nullable;",
  "import com.google.common.collect.ImmutableList;",
  "import static java.util.Objects.requireNonNull;",
  "",
  "public class Example {",
  "  private final List<String> items = new ArrayList<String>();",
  "",
  "  @Nullable",
  "  private String name;",
  "",
  "  @Override",
  "  public String toString() {",
  "    return \"Example: TODO fix this\";",
  "  }",
  "",
  "  public void add(String item, boolean flag) {",
  "    requireNonNull(item);",
  "    if (flag == true) {",
  "      items.add(Strings.trim(item));",
  "    }",
  "  }",
  "",
  "  // spotless:off",
  "  private static final int[] MATRIX = {",
  "    1,   0,   0,",
  "    0,   1,   0,   // TODO alignment kept on purpose",
  "    0,   0,   1 };",
  "  // spotless:on",
  "",
  "  public void check() {",
  "    assertEquals(1, ImmutableList.of(\"a\").size());",
  "  }",
  "}",
  ""
].join("\n");

// googleJavaFormat().aosp(): same, 4-space indent.
const SAMPLE_AOSP = SAMPLE_GJF
  .split("\n")
  .map(l => {
    const m = l.match(/^( +)(.*)$/);
    return m ? SP.repeat(m[1].length * 2) + m[2] : l;
  })
  .join("\n");

// palantirJavaFormat(): 4-space indent, Palantir keeps a blank line after the
// class declaration off and hugs the field block the same way; differences vs
// AOSP show up mostly on long lines, which this sample does not have.
const SAMPLE_PALANTIR = SAMPLE_AOSP;

// eclipse(): 4-space indent (default Eclipse profile uses tabs, but the
// bundled diffplug default config emits spaces) and keeps array init on one
// line when it fits.
const SAMPLE_ECLIPSE = SAMPLE_AOSP
  .replace(
    "    private static final int[] MATRIX = {\n        1,   0,   0,\n        0,   1,   0,   // TODO alignment kept on purpose\n        0,   0,   1 };",
    "    private static final int[] MATRIX = {\n        1,   0,   0,\n        0,   1,   0,   // TODO alignment kept on purpose\n        0,   0,   1\n    };");

const FORMATTERS = [
  {
    id: "none", label: "(none)", text: SAMPLE_NONE, gradle: null, maven: null,
    doc: "No reformatter. Only the cheap steps below run.",
    details: {
      summary: "Leaves layout exactly as written. Useful for seeing what the small, " +
               "surgical steps do on their own without a whole-file reformat on top.",
      rules: [
        "Indentation, line breaks and alignment are whatever the sample already has.",
        "Only the steps you tick below are applied.",
        "This is also what real Spotless does if your java {} block has no reformatter step."
      ],
      opts: [],
      note: "Most projects do run one reformatter. Mixing two is an error - Spotless will " +
            "complain if you configure e.g. googleJavaFormat and eclipse in the same block."
    }
  },
  {
    id: "gjf", label: "googleJavaFormat()", text: SAMPLE_GJF,
    doc: "Google Java Style: 2-space indent, 100-col limit.",
    gradle: () => "googleJavaFormat()",
    maven:  () => "<googleJavaFormat/>",
    details: {
      summary: "Runs google-java-format, the formatter behind Google Java Style. It throws away " +
               "your existing line breaks entirely and re-derives them from the parsed AST, so " +
               "the output is fully deterministic: two files with identical syntax trees format " +
               "to byte-identical text.",
      rules: [
        "2-space indent for blocks, 4-space continuation indent for wrapped expressions.",
        "100-column line limit. Anything longer is broken at the outermost fitting point.",
        "One statement per line; K&R braces; braces required even on single-statement if bodies.",
        "Blank lines you wrote are collapsed to at most one; a blank line is inserted between members.",
        "Annotations on classes/methods/fields go on their own line. Parameter and type-use " +
          "annotations stay inline.",
        "No column alignment - it will not line up your `=` signs or array elements.",
        "Import statements are NOT sorted or removed. Add importOrder / removeUnusedImports for that.",
        "Javadoc is reflowed only if you opt in with formatJavadoc()."
      ],
      opts: [
        ["googleJavaFormat('1.28.0')", "pin the formatter version (default follows the Spotless release)"],
        ["reflowLongStrings()", "split over-long string literals across lines with +"],
        ["formatJavadoc(true)", "reflow Javadoc bodies too (off by default)"],
        ["skipJavadocFormatting()", "explicitly leave all Javadoc alone"]
      ],
      note: "Needs JDK 11+ to run, and on JDK 16+ Spotless has to add --add-exports flags to reach " +
            "internal javac APIs. Fails hard on source it cannot parse, so a syntax error stops the build."
    }
  },
  {
    id: "aosp", label: "googleJavaFormat().aosp()", text: SAMPLE_AOSP,
    doc: "Same formatter, AOSP variant: 4-space indent.",
    gradle: () => "googleJavaFormat().aosp()",
    maven:  () => "<googleJavaFormat>\n  <style>AOSP</style>\n</googleJavaFormat>",
    details: {
      summary: "Identical engine to googleJavaFormat(), switched to the Android Open Source Project " +
               "style variant. The only differences are the indent widths - every other rule about " +
               "line breaking, braces and blank lines is the same.",
      rules: [
        "4-space indent for blocks (vs 2 in the Google variant).",
        "8-space continuation indent for wrapped expressions (vs 4).",
        "Same 100-column limit, same brace style, same annotation placement.",
        "Because the indent is wider, lines wrap sooner than under the Google variant."
      ],
      opts: [
        ["googleJavaFormat().aosp()", "Gradle: chained call"],
        ["<style>AOSP</style>", "Maven: style tag inside <googleJavaFormat>"],
        ["googleJavaFormat('1.28.0').aosp()", "version pin plus the variant"]
      ],
      note: "Pick this if your codebase is Android or already on a 4-space convention. Switching " +
            "between GOOGLE and AOSP re-wraps the whole repo, so it makes for a noisy commit."
    }
  },
  {
    id: "palantir", label: "palantirJavaFormat()", text: SAMPLE_PALANTIR,
    doc: "Palantir fork of google-java-format: 4-space indent, different line breaking.",
    gradle: () => "palantirJavaFormat()",
    maven:  () => "<palantirJavaFormat/>",
    details: {
      summary: "A fork of google-java-format that keeps the deterministic AST-based approach but " +
               "retunes the line-breaking heuristics for readability on wide, chained code - " +
               "builders, streams and long generic signatures.",
      rules: [
        "4-space indent, 120-column limit (google-java-format uses 100).",
        "Prefers breaking a whole chain onto one-call-per-line rather than filling each line up.",
        "Keeps short lambdas and short method bodies on a single line where gjf would explode them.",
        "Less aggressive about splitting method arguments; tries to keep an argument list intact.",
        "Same guarantees otherwise: idempotent, ignores your original line breaks, no alignment.",
        "Also does not touch imports - pair it with importOrder / removeUnusedImports."
      ],
      opts: [
        ["palantirJavaFormat('2.50.0')", "pin the formatter version"],
        ["style('GOOGLE')", "use google-java-format's 100-col style through the Palantir engine"],
        ["formatJavadoc(true)", "reflow Javadoc (2.39.0+)"]
      ],
      note: "Output is close to, but not the same as, google-java-format - the two cannot be mixed " +
            "across a repo without a full reformat. Requires JDK 11+."
    }
  },
  {
    id: "eclipse", label: "eclipse()", text: SAMPLE_ECLIPSE,
    doc: "Eclipse JDT formatter, driven by an exported Eclipse profile.",
    gradle: () => "eclipse()",
    maven:  () => "<eclipse/>",
    details: {
      summary: "Runs the same formatter the Eclipse IDE uses (JDT). Unlike the Google/Palantir " +
               "family it is fully configurable - roughly 300 knobs in an exported XML profile - " +
               "and it respects some of your existing formatting instead of rebuilding every line.",
      rules: [
        "Behaviour is whatever the profile says. With no configFile you get Eclipse's built-in defaults.",
        "Defaults are 4-space indent (the IDE default is tabs; Spotless's bundled default emits spaces).",
        "Can preserve existing line breaks in places, so output is not purely a function of the AST.",
        "Can do column alignment - lining up field assignments or array initialisers - which the " +
          "Google-family formatters refuse to do.",
        "Honours //$FALL-THROUGH$ style tags and the off/on tags configured in the profile.",
        "Also does not sort or remove imports on its own."
      ],
      opts: [
        ["eclipse('4.36')", "pin the JDT version"],
        ["configFile('eclipse-formatter.xml')", "an exported Eclipse profile - the usual way to drive it"],
        ["configProperties('''...''')", "inline org.eclipse.jdt.core.formatter.* properties"],
        ["<file>${project.basedir}/eclipse.xml</file>", "Maven equivalent of configFile"]
      ],
      note: "Export the profile from Eclipse: Preferences > Java > Code Style > Formatter > Export All. " +
            "Different JDT versions can format the same file differently, so pin the version if you " +
            "care about reproducible builds across machines."
    }
  }
];

/* ------------------------------------------------------------------ *
 * Helpers used by the step implementations.
 * ------------------------------------------------------------------ */

function splitImportBlock(src) {
  const lines = src.split("\n");
  let first = -1, last = -1;
  lines.forEach((l, i) => {
    if (/^\s*import\s+/.test(l)) {
      if (first < 0) first = i;
      last = i;
    }
  });
  if (first < 0) return null;
  return { lines, first, last };
}

function parseImports(lines, first, last) {
  const out = [];
  for (let i = first; i <= last; i++) {
    const m = lines[i].match(/^\s*import\s+(static\s+)?([\w.*]+)\s*;/);
    if (m) out.push({ static: !!m[1], name: m[2] });
  }
  return out;
}

function renderImport(imp) {
  return "import " + (imp.static ? "static " : "") + imp.name + ";";
}

// Every identifier-ish token outside the import block, used by
// removeUnusedImports to decide whether a simple name is referenced.
function bodyTokens(lines, first, last) {
  const body = lines.filter((_, i) => i < first || i > last).join("\n");
  return new Set(body.match(/[A-Za-z_$][\w$]*/g) || []);
}

/* ------------------------------------------------------------------ *
 * Steps. One entry drives: the UI control, the transform, the Gradle
 * emitter and the Maven emitter.
 *
 * `apply(src, o)` -> new src.  `o` is the step's current option values.
 * Order in this array is the order the pipeline runs them in.
 * ------------------------------------------------------------------ */

const STEPS = [
  {
    id: "licenseHeader",
    label: "licenseHeader",
    group: "java",
    doc: "Inserts (or updates) a header above the delimiter. $YEAR expands to the current year.",
    opts: [
      { id: "content",   type: "text", def: "/* (C)$YEAR MyCompany */", wide: true },
      { id: "delimiter", type: "text", def: "package " }
    ],
    apply(src, o) {
      const header = o.content.replace(/\$YEAR/g, String(new Date().getFullYear()));
      const lines = src.split("\n");
      const at = lines.findIndex(l => l.startsWith(o.delimiter));
      if (at < 0) return header + "\n" + src;
      // Drop anything already above the delimiter, then insert.
      return header + "\n" + lines.slice(at).join("\n");
    },
    gradle: o => `licenseHeader '${o.content}'` + (o.delimiter === "package " ? "" : `, '${o.delimiter}'`),
    maven:  o => `<licenseHeader>\n  <content>${esc(o.content)}</content>` +
                 (o.delimiter === "package " ? "" : `\n  <delimiter>${esc(o.delimiter)}</delimiter>`) +
                 `\n</licenseHeader>`
  },

  {
    id: "removeUnusedImports",
    label: "removeUnusedImports",
    group: "java",
    doc: "Drops imports whose simple name never appears in the file body.",
    opts: [
      { id: "engine", type: "select", def: "google-java-format",
        choices: ["google-java-format", "cleanthat-javaparser-unnecessaryimport"] }
    ],
    apply(src) {
      const blk = splitImportBlock(src);
      if (!blk) return src;
      const { lines, first, last } = blk;
      const used = bodyTokens(lines, first, last);
      const kept = [];
      for (let i = first; i <= last; i++) {
        const m = lines[i].match(/^\s*import\s+(static\s+)?([\w.*]+)\s*;/);
        if (!m) continue;                                  // blank line inside the block
        const simple = m[2].split(".").pop();
        if (simple === "*" || used.has(simple)) kept.push(lines[i].replace(/\s+$/, ""));
      }
      return lines.slice(0, first).concat(kept, lines.slice(last + 1)).join("\n");
    },
    gradle: o => o.engine === "google-java-format"
      ? "removeUnusedImports()"
      : `removeUnusedImports('${o.engine}')`,
    maven:  o => o.engine === "google-java-format"
      ? "<removeUnusedImports/>"
      : `<removeUnusedImports>\n  <engine>${esc(o.engine)}</engine>\n</removeUnusedImports>`
  },

  {
    id: "importOrder",
    label: "importOrder",
    group: "java",
    doc: "Sorts imports into groups. Comma-separated; empty slot = catch-all, \\# prefix = static.",
    opts: [
      { id: "order",         type: "text", def: "java|javax,,\\#", wide: true },
      { id: "wildcardsLast", type: "bool", def: false },
      { id: "semanticSort",  type: "bool", def: false }
    ],
    apply(src, o) {
      const blk = splitImportBlock(src);
      if (!blk) return src;
      const { lines, first, last } = blk;
      const imports = parseImports(lines, first, last);

      const groups = o.order.split(",").map(g => g.trim());
      const buckets = groups.map(() => []);
      const catchAllIdx = groups.findIndex(g => g === "");
      const staticCatchAll = groups.findIndex(g => g === "\\#" || g === "#");

      const score = (g, imp) => {
        const isStatic = g.startsWith("\\#") || g.startsWith("#");
        if (isStatic !== imp.static) return -1;
        const prefixes = g.replace(/^\\?#/, "").split("|").filter(Boolean);
        if (!prefixes.length) return 0;                    // bare catch-all for this staticness
        let best = -1;
        for (const p of prefixes) {
          if (imp.name === p || imp.name.startsWith(p + ".")) best = Math.max(best, p.length);
        }
        return best;
      };

      for (const imp of imports) {
        let bestIdx = -1, bestScore = -1;
        groups.forEach((g, i) => {
          const s = score(g, imp);
          if (s > bestScore) { bestScore = s; bestIdx = i; }
        });
        if (bestScore <= 0) {
          bestIdx = imp.static
            ? (staticCatchAll >= 0 ? staticCatchAll : (catchAllIdx >= 0 ? catchAllIdx : 0))
            : (catchAllIdx >= 0 ? catchAllIdx : 0);
        }
        buckets[bestIdx].push(imp);
      }

      const cmp = (a, b) => {
        if (o.wildcardsLast) {
          const aw = a.name.endsWith(".*"), bw = b.name.endsWith(".*");
          if (aw !== bw) return aw ? 1 : -1;
        }
        if (o.semanticSort) {
          // Sort by package first, then by simple name.
          const ap = a.name.split("."), bp = b.name.split(".");
          const apk = ap.slice(0, -1).join("."), bpk = bp.slice(0, -1).join(".");
          if (apk !== bpk) return apk < bpk ? -1 : 1;
          return ap[ap.length - 1] < bp[bp.length - 1] ? -1 : 1;
        }
        return a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
      };

      const rendered = [];
      buckets.forEach(b => {
        if (!b.length) return;
        if (rendered.length) rendered.push("");
        b.sort(cmp).forEach(i => rendered.push(renderImport(i)));
      });

      return lines.slice(0, first).concat(rendered, lines.slice(last + 1)).join("\n");
    },
    gradle: o => {
      const args = o.order.split(",").map(g => `'${g.trim()}'`).join(", ");
      let s = `importOrder(${args})`;
      if (o.wildcardsLast) s += "\n// wildcardsLast is Maven-only in this visualizer";
      return s;
    },
    maven: o => {
      let s = `<importOrder>\n  <order>${esc(o.order)}</order>`;
      if (o.wildcardsLast) s += `\n  <wildcardsLast>true</wildcardsLast>`;
      if (o.semanticSort)  s += `\n  <semanticSort>true</semanticSort>`;
      return s + `\n</importOrder>`;
    }
  },

  {
    id: "formatAnnotations",

    group: "java",
    doc: "Pulls type annotations back onto the line of the type they annotate.",
    opts: [

    apply(src, o) {
      const known = new Set(["Nullable", "NonNull", "Nonnull", "Untainted", "Tainted",

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */

function defaultState() {
  const s = { formatter: "none", enabled: {}, opts: {}, build: "gradle", view: "diff" };
  for (const step of STEPS) {
    s.enabled[step.id] = false;
    s.opts[step.id] = {};
    for (const o of step.opts) s.opts[step.id][o.id] = o.def;
  }
  // A useful starting config rather than a blank page.
  s.enabled.removeUnusedImports = true;
  s.enabled.importOrder = true;
  s.enabled.trimTrailingWhitespace = true;
  s.enabled.endWithNewline = true;
  s.enabled.toggleOffOn = true;
  return s;
}

let state = defaultState();

/* ------------------------------------------------------------------ *
 * Pipeline
 * ------------------------------------------------------------------ */

/* toggleOffOn, the way Spotless does it: the frozen regions are lifted out and
 * replaced by a one-line sentinel, the whole file is then formatted as usual
 * (so steps like removeUnusedImports still see the entire body), and the
 * regions are put back verbatim afterwards. */

// Shaped like a comment with no leading or trailing whitespace, so trimming
// and re-indenting steps leave it untouched and we can find it again at the end.
const SENTINEL = "//SPOTLESS_OFF_REGION_";

function liftFrozenRegions(src, off, on) {
  const frozen = [];
  const out = [];
  let buf = null;
  for (const line of src.split("\n")) {
    if (buf === null && line.includes(off)) {
      buf = [line];
    } else if (buf !== null) {
      buf.push(line);
      if (line.includes(on)) {
        out.push(SENTINEL + frozen.length);
        frozen.push(buf);
        buf = null;
      }
    } else {
      out.push(line);
    }
  }
  if (buf !== null) {                                      // unterminated off region
    out.push(SENTINEL + frozen.length);
    frozen.push(buf);
  }
  return { text: out.join("\n"), frozen };
}

/* Blame: which steps touched which lines.
 *
 * A "traced" value is { lines: string[], blame: Set<stepId>[] } - one blame set
 * per line. Each step runs on the plain text, then the before/after are aligned
 * with the same LCS used by the diff view so surviving lines keep their history
 * and lines the step introduced get credited to it. Deletions are credited to
 * the line that lands next to them, so a hover on the following line still
 * explains what removed its neighbour. */

function traced(text) {
  const lines = text.split("\n");
  return { lines, blame: lines.map(() => new Set()) };
}

function blameStep(before, afterText, stepId) {
  const after = afterText.split("\n");
  const rows = diffLines(before.lines, after);
  const blame = [];
  let i = 0, j = 0;
  let pending = false;                                     // a deletion waiting to be attributed

  for (const r of rows) {
    if (r.t === "same") {
      const set = new Set(before.blame[i]);
      if (pending) { set.add(stepId); pending = false; }
      blame.push(set);
      i++; j++;
    } else if (r.t === "del") {
      pending = true;                                      // credited to the next surviving line
      i++;
    } else {
      blame.push(new Set([stepId]));
      pending = false;
      j++;
    }
  }
  if (pending && blame.length) blame[blame.length - 1].add(stepId);
  return { lines: after, blame };
}

// Put the lifted regions back where their sentinel ended up, crediting every
// restored line to toggleOffOn.
function restoreFrozenRegions(t, frozen) {
  const lines = [], blame = [];
  t.lines.forEach((line, i) => {
    const m = line.match(new RegExp("^\\s*" + SENTINEL + "(\\d+)\\s*$"));
    if (!m) { lines.push(line); blame.push(t.blame[i]); return; }
    frozen[Number(m[1])].forEach(f => {
      lines.push(f);
      blame.push(new Set(["toggleOffOn"]));
    });
  });
  return { lines, blame };
}

function runPipeline() {
  const formatter = FORMATTERS.find(f => f.id === state.formatter) || FORMATTERS[0];
  const base = formatter.text;

  const active = STEPS.filter(s => state.enabled[s.id] && typeof s.apply === "function");
  const fold = src => active.reduce(
    (acc, s) => blameStep(acc, s.apply(acc.lines.join("\n"), state.opts[s.id]), s.id),
    traced(src));

  const toggle = state.enabled.toggleOffOn ? state.opts.toggleOffOn : null;
  let result;
  if (toggle) {
    const lifted = liftFrozenRegions(base, toggle.off, toggle.on);
    result = restoreFrozenRegions(fold(lifted.text), lifted.frozen);
  } else {
    result = fold(base);
  }

  // The chosen reformatter is itself a change vs the unformatted sample.
  if (formatter.id !== "none") {
    const vsRaw = diffLines(FORMATTERS[0].text.split("\n"), result.lines);
    let k = 0;
    for (const r of vsRaw) {
      if (r.t === "del") continue;
      // Only credit the reformatter when no cheap step already explains the
      // line - otherwise it would tag nearly everything and drown the detail.
      if (r.t === "add" && !result.blame[k].size) result.blame[k].add("formatter");
      k++;
    }
  }
  return result;
}

/* ------------------------------------------------------------------ *
 * Diff (line-based LCS)
 * ------------------------------------------------------------------ */

function diffLines(a, b) {
  const n = a.length, m = b.length;
  const lcs = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      lcs[i][j] = a[i] === b[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);

  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push({ t: "same", text: b[j] }); i++; j++; }
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) { out.push({ t: "del", text: a[i] }); i++; }
    else { out.push({ t: "add", text: b[j] }); j++; }
  }
  while (i < n) out.push({ t: "del", text: a[i++] });
  while (j < m) out.push({ t: "add", text: b[j++] });
  return out;
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */

// Trailing whitespace and tabs are the whole point of some steps, so show them.
function visibleWs(text) {
  return esc(text)
    .replace(/\t/g, '<span class="ws">→   </span>')
    .replace(/([ ]+)$/, (m) => '<span class="ws">' + "·".repeat(m.length) + "</span>");
}

// Human-readable "what changed this line", built from a blame set.
function blameTitle(ids) {
  if (!ids || !ids.size) return "";
  const parts = [];
  ids.forEach(id => {
    if (id === "formatter") {
      const f = FORMATTERS.find(x => x.id === state.formatter);
      parts.push(f.label + "\n    " + f.doc);
      return;
    }
    const step = STEPS.find(s => s.id === id);
    if (!step) return;
    const o = state.opts[id];
    const shown = step.opts
      .filter(opt => o[opt.id] !== "" && o[opt.id] !== false)
      .map(opt => "    " + opt.id + " = " + o[opt.id]);
    parts.push(step.label + (shown.length ? "\n" + shown.join("\n") : ""));
  });
  return parts.join("\n\n");
}

function renderResult() {
  const before = FORMATTERS[0].text;
  const res = runPipeline();
  const after = res.lines.join("\n");
  const el = document.getElementById("result");

  const attr = ids => {
    const t = blameTitle(ids);
    return t ? ` data-blame="${esc(t)}"` : "";
  };

  let html = "";
  if (state.view === "result") {
    res.lines.forEach((line, idx) => {
      html += `<span class="ln" data-n="${idx + 1}"${attr(res.blame[idx])}>${visibleWs(line) || "&nbsp;"}</span>`;
    });
  } else {
    const rows = diffLines(before.split("\n"), res.lines);
    let n = 0, j = 0;
    rows.forEach((r, idx) => {
      let ids;
      if (r.t === "del") {
        // A removed line has no slot in `blame`; borrow the surviving neighbour's,
        // which is exactly where the removal was credited.
        ids = res.blame[j] || res.blame[j - 1];
      } else {
        ids = res.blame[j];
        j++;
      }
      const num = r.t === "del" ? "" : String(++n);
      html += `<span class="ln ${r.t}" data-n="${num}"${r.t === "same" ? "" : attr(ids)}>${visibleWs(r.text) || "&nbsp;"}</span>`;
    });
  }
  if (after.endsWith("\n")) {
    html += `<span class="ln eof" data-n="">↵ file ends with newline</span>`;
  } else {
    html += `<span class="ln eof" data-n="">✘ no trailing newline</span>`;
  }
  el.innerHTML = html;
}

function indentBlock(text, pad) {
  return text.split("\n").map(l => pad + l).join("\n");
}

function renderConfig() {
  const formatter = FORMATTERS.find(f => f.id === state.formatter);
  const active = STEPS.filter(s => state.enabled[s.id]);
  const el = document.getElementById("config");
  let text;

  if (state.build === "gradle") {
    const body = [];
    if (formatter && formatter.gradle) body.push(formatter.gradle());
    active.forEach(s => body.push(s.gradle(state.opts[s.id])));
    text = [
      "// build.gradle  (truncated)",
      "plugins {",
      "    id 'java'",
      "    id 'com.diffplug.spotless' version '7.0.2'",
      "}",
      "",
      "spotless {",
      "    java {",
      body.length ? indentBlock(body.join("\n"), "        ") : "        // no steps enabled",
      "    }",
      "}"
    ].join("\n");
  } else {
    const body = [];
    if (formatter && formatter.maven) body.push(formatter.maven());
    active.forEach(s => body.push(s.maven(state.opts[s.id])));
    text = [
      "<!-- pom.xml  (truncated) -->",
      "<plugin>",
      "  <groupId>com.diffplug.spotless</groupId>",
      "  <artifactId>spotless-maven-plugin</artifactId>",
      "  <version>2.44.4</version>",
      "  <configuration>",
      "    <java>",
      body.length ? indentBlock(body.join("\n"), "      ") : "      <!-- no steps enabled -->",
      "    </java>",
      "  </configuration>",
      "</plugin>"
    ].join("\n");
  }

  el.dataset.raw = text;
  el.innerHTML = text.split("\n")
    .map((l, i) => `<span class="ln" data-n="${i + 1}">${esc(l) || "&nbsp;"}</span>`)
    .join("");
}

function optControl(step, opt) {
  const val = state.opts[step.id][opt.id];
  const id = `opt-${step.id}-${opt.id}`;
  let ctrl;
  if (opt.type === "bool") {
    ctrl = `<input type="checkbox" id="${id}" ${val ? "checked" : ""}>`;
  } else if (opt.type === "int") {
    ctrl = `<input type="number" id="${id}" min="1" max="16" value="${esc(val)}">`;
  } else if (opt.type === "select") {
    ctrl = `<select id="${id}">` +
      opt.choices.map(c => `<option ${c === val ? "selected" : ""}>${esc(c)}</option>`).join("") +
      `</select>`;
  } else {
    ctrl = `<input type="text" id="${id}" class="${opt.wide ? "wide" : ""}" value="${esc(val)}">`;
  }
  return `<span class="opt"><label for="${id}">${opt.id}</label>${ctrl}</span>`;
}

function renderSteps() {
  const host = document.getElementById("steps");
  let html = "";

  html += `<div class="group-title">Reformatter (pick one)</div>`;
  html += `<div class="group-note">Real formatters can't run in a browser &mdash; these are hand-written illustrative snapshots. Every step below is really executed on top of the one you pick.</div>`;
  FORMATTERS.forEach(f => {
    const on = state.formatter === f.id;
    html += `<div class="step ${on ? "on" : ""}">
      <div class="step-row">
        <input type="radio" name="formatter" id="fmt-${f.id}" value="${f.id}" ${on ? "checked" : ""}>
        <label for="fmt-${f.id}">${esc(f.label)}</label>
        <button class="help" data-help="${f.id}" title="what this formatter does">?</button>
      </div>
      <div class="doc">${esc(f.doc)}</div>
    </div>`;
  });

  [["java", "Java steps"], ["generic", "Generic steps"]].forEach(([g, title]) => {
    html += `<div class="group-title">${title}</div>`;
    STEPS.filter(s => s.group === g).forEach(s => {
      const on = state.enabled[s.id];
      html += `<div class="step ${on ? "on" : ""}">
        <div class="step-row">
          <input type="checkbox" id="step-${s.id}" ${on ? "checked" : ""}>
          <label for="step-${s.id}">${esc(s.label)}</label>
        </div>
        <div class="doc">${esc(s.doc)}</div>
        ${s.opts.length ? `<div class="opts">${s.opts.map(o => optControl(s, o)).join("")}</div>` : ""}
      </div>`;
    });
  });

  host.innerHTML = html;

  host.querySelectorAll('input[name=formatter]').forEach(el => {
    el.addEventListener("change", () => { state.formatter = el.value; render(); });
  });
  host.querySelectorAll("button.help").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      openFormatterHelp(btn.dataset.help);
    });
  });
  STEPS.forEach(s => {
    const box = document.getElementById("step-" + s.id);
    box.addEventListener("change", () => { state.enabled[s.id] = box.checked; render(); });
    s.opts.forEach(o => {
      const el = document.getElementById(`opt-${s.id}-${o.id}`);
      if (!el) return;
      const evt = o.type === "bool" || o.type === "select" ? "change" : "input";
      el.addEventListener(evt, () => {
        state.opts[s.id][o.id] =
          o.type === "bool" ? el.checked :
          o.type === "int"  ? parseInt(el.value, 10) || o.def : el.value;
        renderConfig();
        renderResult();
        // Keep the toggled-on styling in sync without rebuilding (would drop focus).
        el.closest(".step").classList.toggle("on", state.enabled[s.id]);
      });
    });
  });
}

function render() {
  renderSteps();
  renderConfig();
  renderResult();
}

document.querySelectorAll(".tab[data-build]").forEach(t => {
  t.addEventListener("click", () => {
    state.build = t.dataset.build;
    document.querySelectorAll(".tab[data-build]").forEach(x => x.classList.toggle("active", x === t));
    renderConfig();

document.querySelectorAll(".tab[data-view]").forEach(t => {
  t.addEventListener("click", () => {

    document.querySelectorAll(".tab[data-view]").forEach(x => x.classList.toggle("active", x === t));
    renderResult();

});

/* Formatter help modal: the reformatters are the one thing this page cannot
 * actually run, so the "?" spells out what the real step would do. */
function openFormatterHelp(id) {
  const f = FORMATTERS.find(x => x.id === id);
  if (!f || !f.details) return;
  const d = f.details;

  let html = `<h4>What it does</h4><p>${esc(d.summary)}</p>`;
  if (d.rules.length) {
    html += `<h4>Concretely</h4><ul>` +
      d.rules.map(r => `<li>${esc(r)}</li>`).join("") + `</ul>`;
  }
  if (d.opts.length) {
    html += `<h4>Common options</h4>` +
      d.opts.map(([call, what]) =>
        `<div class="opt-row"><code>${esc(call)}</code><span>${esc(what)}</span></div>`).join("");
  }
  if (d.note) html += `<div class="note">${esc(d.note)}</div>`;
  if (f.id !== "none") {
    html += `<div class="note">The panel on the right shows a hand-written snapshot of roughly ` +
            `this formatter's output, not its real result &mdash; ${esc(f.label)} needs a JVM. ` +
            `Every other step is genuinely executed on top of it.</div>`;
  }

  document.getElementById("modal-title").textContent = f.label;
  document.getElementById("modal-body").innerHTML = html;
  const modal = document.getElementById("modal");
  modal.hidden = false;
  document.getElementById("modal-close").focus();
}

function closeFormatterHelp() {
  document.getElementById("modal").hidden = true;
}

document.getElementById("modal-close").addEventListener("click", closeFormatterHelp);
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeFormatterHelp();      // click the backdrop
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeFormatterHelp();
});

/* Blame tooltip: hover any changed line to see which step (and which of its
 * option values) produced it. Delegated, so it survives re-renders. */
(function blameTooltip() {
  const tip = document.getElementById("tip");
  const result = document.getElementById("result");
  let current = null;

  const place = (e) => {
    const pad = 14;
    const r = tip.getBoundingClientRect();
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = Math.max(8, x) + "px";
    tip.style.top = Math.max(8, y) + "px";
  };

  result.addEventListener("mousemove", (e) => {
    const ln = e.target.closest(".ln[data-blame]");
    if (!ln) {
      if (current) { tip.style.display = "none"; current = null; }
      return;
    }
    if (ln !== current) {
      current = ln;
      const body = ln.dataset.blame.split("\n\n")
        .map(block => {
          const [head, ...rest] = block.split("\n");
          return `<span class="tip-step">${esc(head)}</span>` +
                 (rest.length ? "\n" + esc(rest.join("\n")) : "");
        })
        .join("\n\n");
      const kind = ln.classList.contains("del") ? "removed by" :
                   ln.classList.contains("add") ? "changed by" : "kept by";
      tip.innerHTML = `<div class="tip-head">${kind}</div>${body}`;
      tip.style.display = "block";
    }
    place(e);
  });

  result.addEventListener("mouseleave", () => {
    tip.style.display = "none";
    current = null;
  });
})();

document.getElementById("btn-copy").addEventListener("click", async () => {
  const btn = document.getElementById("btn-copy");
  try {
    await navigator.clipboard.writeText(document.getElementById("config").dataset.raw);
    btn.textContent = "copied";
  } catch {
    btn.textContent = "copy failed";
  }
  setTimeout(() => { btn.textContent = "copy"; }, 1200);
});

document.getElementById("btn-reset").addEventListener("click", () => {
  state = defaultState();
  document.querySelectorAll(".tab[data-build]").forEach(x => x.classList.toggle("active", x.dataset.build === "gradle"));
  document.querySelectorAll(".tab[data-view]").forEach(x => x.classList.toggle("active", x.dataset.view === "diff"));
  render();
});

render();
